  }
  const card = document.getElementById('showcaseSettingsCard');
  if (!card) return;
  if (tab === 'install') {
    card.innerHTML = `<div class="card-head"><div><h3>Install & App Settings</h3><div class="tiny">Add EduPredict AI to your home screen or desktop for fast, distraction-free access.</div></div><span class="badge good">PWA Ready</span></div>
      <div class="setting-row"><div><strong>Install EduPredict Web App</strong><span>Install as a standalone application on Windows, macOS, Android, or iOS with offline support.</span></div><button class="primary-btn"><span style="font-size:12px">⌂</span> Install app</button></div>

      <div class="color-mode-note"><b>PWA Advantage:</b> Installing EduPredict AI adds an app icon to your home screen or taskbar, enables instant startup, and keeps your academic dashboard available even with intermittent connectivity.</div>`;
  } else if (tab === 'appearance') {
    card.innerHTML = `<div class="card-head"><div><h3>Workspace settings</h3><div class="tiny">Personalize the interface for your screen and workflow.</div></div><span class="badge good">Synced locally</span></div>

  } else {
    card.innerHTML = `<div class="card-head"><div><h3>${tab.charAt(0).toUpperCase()+tab.slice(1)} Settings</h3><div class="tiny">Settings and preferences for EduPredict AI.</div></div><span class="badge good">Active</span></div>
